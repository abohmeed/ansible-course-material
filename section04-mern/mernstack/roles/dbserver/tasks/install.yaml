---
# Steps from https://www.mongodb.com/docs/manual/tutorial/install-mongodb-on-ubuntu/
- name: Install pip
  ansible.builtin.apt:
    name: python3-pip
    state: present

# Lab shortcut from the video (Ubuntu 24.04 / Python 3.12). Cleaner alternative:
# install the distro package instead:  ansible.builtin.apt: name=python3-pymongo
- name: Allow PIP to install packages globally
  ansible.builtin.file:
    path: /usr/lib/python3.12/EXTERNALLY-MANAGED
    state: absent

- name: Install pymongo
  ansible.builtin.pip:
    name: "{{ item }}"
    state: latest
    executable: pip3
  loop:
    - pymongo
    - configparser

- name: Add MongoDB repository using deb822_repository
  ansible.builtin.deb822_repository:
    name: mongodb
    types: deb
    uris: "https://repo.mongodb.org/apt/ubuntu"
    components: [multiverse]
    architectures: [amd64, arm64]
    suites: "{{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }}"
    signed_by: "{{ mongodb_repo_key }}"

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install MongoDB packages
  ansible.builtin.apt:
    name: mongodb-org
    state: present

- name: Ensure MongoDB is enabled and started
  ansible.builtin.service:
    name: mongod
    state: started
    enabled: true
